<div class="raw-preview-card" id="frank-qc-panel">
    <div class="panel-heading"><div><h4>Quality control</h4><p>{{ frank_qc.input_label|default:'Automatic columns' }} · Standard QC settings</p></div>
    {% if frank_qc.available %}<span class="preview-badge qc-{{ frank_qc.report.status }}">{{ frank_qc.report.status }}</span>{% endif %}</div>
    {% if frank_qc.available %}
    <div class="frank-plots">{% for plot in frank_qc.plots %}<figure><a href="{{ plot.url }}" target="_blank" rel="noopener"><img src="{{ plot.url }}" alt="{{ plot.label }} - QC"></a><figcaption>{{ plot.label }}</figcaption></figure>{% endfor %}</div>
    {% else %}<p class="preview-status review">{{ frank_qc.error }}</p>{% endif %}
</div>
