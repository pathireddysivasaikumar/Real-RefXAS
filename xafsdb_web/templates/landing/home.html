{% load static %}

<html>

  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <link rel="stylesheet" type="text/css" href="{% static 'css/base.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;500;700;900&family=Sen:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.2/css/all.min.css">
    <link rel="shortcut icon" type="image/png" href="{% static 'img/favicon.ico' %}">

    {% block title %}
        <title>RefXAS - Home</title>
    {% endblock %}

    <style>
      .refxas-home-hero {
        width: 100%;
        max-width: 1500px;

        /*
          Important:
          This keeps the full image visible without cutting/cropping.
          The image will fit inside the hero area.
        */
        aspect-ratio: 16 / 9;

        margin: 28px auto 40px auto;
        border-radius: 6px;

        background-image: url("{% static 'img/refxas_home_background.png' %}");
        background-size: contain;
        background-position: center center;
        background-repeat: no-repeat;
        background-color: #ffffff;

        position: relative;
        overflow: hidden;
      }

      .link-under-button {
        text-align: center;
        margin-top: 10px;
      }

      @media screen and (max-width: 900px) {
        .refxas-home-hero {
          width: 96%;
          margin: 20px auto 30px auto;
          aspect-ratio: 16 / 9;
        }
      }
    </style>

  </head>

<body>

    {% include "landing/navbar.html" %}

    <!-- main -->
    <main class="page">

      <header class="refxas-home-hero"></header>

      {% block home_buttons %}
        <div class="button-center">
          <button class="button button4"><a href="{% url 'dataset_list' %}">Browse all datasets</a></button>
          <div class="link-under-button">
            <a href="https://san-wierpa.github.io/xafsdb4daphne/" target="_blank">Visit the docs</a>
          </div>
          <div class="link-under-button">
            <p>Publications:</p>
            <a href="https://doi.org/10.52825/cordi.v1i.258" target="_blank">CoRDI: 10.52825 </a><br>
            <a href="https://doi.org/10.5281/zenodo.8412918" target="_blank"><img src="https://zenodo.org/badge/DOI/10.5281/zenodo.8412918.svg" alt="DOI"></a>
          </div>
        </div>

      {% endblock %}

    </main>


    {% include "landing/footer.html" %}
</body>
</html>
